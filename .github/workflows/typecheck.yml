name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Admin bootstrap regression tests
        run: npm run test:seed

      - name: Validate bootstrap Compose profile
        env:
          DB_PASSWORD: ci-only-not-a-secret
          AUTH_SECRET: ci-only-not-a-secret
          ADMIN_EMAIL: admin@example.invalid
          ADMIN_PASSWORD: V3ry-Long-CI-Passphrase!
        run: docker compose --profile bootstrap config --quiet

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings=0
        continue-on-error: true # warnings no bloquean
